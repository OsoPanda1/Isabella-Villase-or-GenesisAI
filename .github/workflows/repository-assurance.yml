name: Repository Assurance

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "evolution/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run dependency-free structural audit
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/repository-assurance.mjs
      - name: Publish machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-assurance-${{ github.sha }}
          path: |
            artifacts/assurance/repository-assurance.json
            artifacts/assurance/repository-assurance.md
          if-no-files-found: warn
          retention-days: 30
