name: IGE-Ω Rust MVP CI

on:
  push:
    branches: ["main", "feat/**", "evolution/**"]
    paths:
      - "ige-omega/**"
      - ".github/workflows/ige-omega-ci.yml"
  pull_request:
    paths:
      - "ige-omega/**"
      - ".github/workflows/ige-omega-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ige-omega-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-mvp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ige-omega
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ige-omega -> target
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Compile and lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit and contract tests
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release -p gateway
