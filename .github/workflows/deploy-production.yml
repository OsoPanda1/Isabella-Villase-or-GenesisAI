# deploy-production.yml — cierre de aceptación ISA-325 / ISA-378.
#
# GATE estricto de despliegue a producción:
#   1. `secret-scan`       — gitleaks@v3 sobre el árbol completo (mismo SHA).
#   2. `verify-artifact`   — descarga `production-evidence-<sha>` y
#      `security-suite-<sha>` del run de CI que produjo ese SHA, y FALLA si
#      `typecheck.ok !== true`, `tests.failed > 0` o `gate.ok !== true`.
#   3. `deploy`            — `environment: production` (aprobación humana se
#      configura en el entorno de GitHub, no se puede forzar desde YAML).
#
# Despliegue automático: se dispara al COMPLETAR el workflow "Isabella Genesis
# CI" (`workflow_run`). Un `push` a main no puede consumir artefactos de otro
# run (los artefactos son por-run), por eso este gate se engancha al `run`
# completo de CI en vez de a un segundo workflow paralelo; es la forma honesta
# de "consumir el artefacto del run anterior con nombre por SHA".
# Manual: `workflow_dispatch` con el `run_id` del CI que generó la evidencia.
#
# Sin secretos en logs: nunca se imprime el contenido de la evidencia, sólo
# veredictos booleanos y el SHA.
name: Deploy Production

on:
  workflow_run:
    workflows: ["Isabella Genesis CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions run ID de 'Isabella Genesis CI' que produjo la evidencia"
        required: true
        type: string

permissions:
  contents: read
  # actions: write es el scope mínimo necesario para subir el artefacto de
  # despliegue; verificar/adquirir artefactos cross-run requiere `actions: read`
  # (write implica read). No se conceden deployments/issues/etc.
  actions: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout with full history (same SHA reachable)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: secret-scan
    env:
      CI_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.run_id }}
      THE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Download production evidence (same SHA)
        uses: actions/download-artifact@v4
        with:
          name: production-evidence-${{ env.THE_SHA }}
          path: evidence/
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download security suite (same SHA)
        uses: actions/download-artifact@v4
        with:
          name: security-suite-${{ env.THE_SHA }}
          path: evidence/
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Strict gate — production evidence and security suite
        run: |
          node -e '
            const fs = require("node:fs");
            const pePath = "evidence/production-evidence.json";
            const ssPath = "evidence/security-suite.json";
            if (!fs.existsSync(pePath)) {
              console.error("DEPLOY GATE FAILED: missing " + pePath);
              process.exit(1);
            }
            const pe = JSON.parse(fs.readFileSync(pePath, "utf8"));
            const typecheckOk = !!(pe.typecheck && pe.typecheck.ok === true);
            const testsFailed = Number(pe.tests && pe.tests.failed) || 0;
            const gateOk = !!(pe.gate && pe.gate.ok === true);
            console.log("production-evidence: gate.ok=" + String(gateOk) +
              " typecheck.ok=" + String(typecheckOk) +
              " tests.failed=" + String(testsFailed));
            if (!typecheckOk || testsFailed > 0 || !gateOk) {
              console.error("DEPLOY GATE FAILED: typecheck no verde, tests fallidos o gate no ok.");
              process.exit(1);
            }
            if (!fs.existsSync(ssPath)) {
              console.error("DEPLOY GATE FAILED: missing " + ssPath);
              process.exit(1);
            }
            const ss = JSON.parse(fs.readFileSync(ssPath, "utf8"));
            const suiteOk = !!(ss.summary && ss.summary.ok === true && ss.summary.failed === 0);
            console.log("security-suite: ok=" + String(suiteOk));
            if (!suiteOk) {
              console.error("DEPLOY GATE FAILED: security suite no ok.");
              process.exit(1);
            }
            console.log("DEPLOY GATE OK for " + process.env.THE_SHA);
          '
        env:
          THE_SHA: ${{ env.THE_SHA }}

      - name: Upload deploy evidence (same SHA)
        uses: actions/upload-artifact@v4
        with:
          name: deploy-evidence-${{ env.THE_SHA }}
          path: evidence/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [secret-scan, verify-artifact]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deployment step (evidence gate already verified)
        run: |
          echo "Deployment approval gate reached; evidence verified for ${GITHUB_SHA}."
          echo "El despliegue real se delega al operador; nunca se imprimen secretos."